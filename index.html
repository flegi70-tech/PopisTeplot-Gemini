<!DOCTYPE html>
<html lang="cs" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zápis teplot – Provozovna</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #1e293b;
      border-radius: 3px;
    }

    /* Optimalizace pro tisk: 2 týdny přesně na 1 stranu A4, úsporný kompaktní tisk */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body {
        background-color: white !important;
        color: black !important;
        font-size: 8pt !important;
        line-height: 1.15 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        background-color: white !important;
        color: black !important;
        padding: 0 !important;
        margin: 0 0 6mm 0 !important;
        border: 1px solid #999 !important;
        box-shadow: none !important;
      }
      table {
        border-collapse: collapse !important;
        width: 100% !important;
        color: black !important;
        font-size: 8pt !important;
      }
      th, td {
        border: 1px solid #444 !important;
        padding: 2px 4px !important;
        color: black !important;
        background: transparent !important;
      }
      th {
        background-color: #e2e8f0 !important;
        font-weight: bold !important;
      }
      .print-header {
        display: block !important;
        margin-bottom: 4px;
        border-bottom: 1px solid #000;
        padding-bottom: 2px;
        font-size: 9pt;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- TOP BAR / HLAVIČKA -->
  <header class="no-print bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-20 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          <span>Zápis teplot</span>
          <span class="text-slate-500">–</span>
          <input type="text" id="facilityNameInput" value="Provozovna" onchange="updateFacilityName(this.value)"
            class="bg-slate-800 text-emerald-400 font-semibold px-2 py-0.5 rounded border border-slate-700 focus:outline-none focus:border-emerald-500 w-40 text-sm">
        </h1>
        <p class="text-[11px] text-slate-400">Hygienický deník měření teplot stravy</p>
      </div>

      <!-- Navigace měsíců -->
      <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-1">
        <button onclick="changeMonth(-1)" class="p-1 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition">◄</button>
        <div class="px-2 py-0.5 text-sm font-medium text-emerald-400 flex items-center gap-2">
          <select id="monthSelect" onchange="onMonthSelectChange()" class="bg-transparent text-emerald-400 font-bold focus:outline-none cursor-pointer text-sm">
            <option value="0" class="bg-slate-900 text-white">Leden</option>
            <option value="1" class="bg-slate-900 text-white">Únor</option>
            <option value="2" class="bg-slate-900 text-white">Březen</option>
            <option value="3" class="bg-slate-900 text-white">Duben</option>
            <option value="4" class="bg-slate-900 text-white">Květen</option>
            <option value="5" class="bg-slate-900 text-white">Červen</option>
            <option value="6" class="bg-slate-900 text-white">Červenec</option>
            <option value="7" class="bg-slate-900 text-white">Srpen</option>
            <option value="8" class="bg-slate-900 text-white">Září</option>
            <option value="9" class="bg-slate-900 text-white">Říjen</option>
            <option value="10" class="bg-slate-900 text-white">Listopad</option>
            <option value="11" class="bg-slate-900 text-white">Prosinec</option>
          </select>
          <input type="number" id="yearInput" onchange="onYearInputChange()" class="w-14 bg-transparent text-emerald-400 font-bold focus:outline-none border-b border-emerald-500/40 text-center text-sm">
        </div>
        <button onclick="changeMonth(1)" class="p-1 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition">►</button>
        <button onclick="setCurrentMonth()" class="ml-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">Dnes</button>
      </div>

      <!-- Akce hlavičky -->
      <div class="flex items-center gap-2">
        <button onclick="openSettings()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1 transition">
          <span>⚙️</span> Nastavení
        </button>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-medium text-xs shadow transition">
          🖨️ Tisk / PDF (2 týdny na A4)
        </button>
      </div>
    </div>
  </header>

  <!-- HLAVNÍ OBSAH / DASHBOARD MĚSÍCE -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-6">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl">
      <!-- Legenda se 3 barevnými tečkami (bez velkého nadpisu a textu) -->
      <div class="flex items-center justify-end gap-3 text-xs border-b border-slate-800 pb-3 mb-4">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Zapsáno</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> S nápravou</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Chybí záznam</span>
      </div>
      
      <!-- Seznam dnů -->
      <div id="daysDashboardGrid" class="space-y-2"></div>
    </div>

    <!-- SKRYTÁ TISKOVÁ SEKCE (Generuje přesně 2 týdny na 1 stránku A4) -->
    <div id="printWeeksContainer" class="hidden print:block space-y-4"></div>
  </main>

  <!-- MODAL PRO RYCHLÝ ZÁPIS DNE -->
  <div id="dayModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-2xl shadow-2xl overflow-hidden my-8">
      
      <!-- Hlavička modalu -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
        <h2 id="modalTitle" class="text-lg font-bold text-white">Zápis dne</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-sm">Zavřít</button>
      </div>

      <!-- Tělo modalu -->
      <div class="p-5 space-y-4 max-h-[75vh] overflow-y-auto">
        <!-- Výběr jména -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Jméno odpovědné osoby</label>
          <select id="modalStaffSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <!-- Dynamicky naplněno -->
          </select>
        </div>

        <hr class="border-slate-800">

        <!-- Seznam jídel pro daný den -->
        <div id="modalFoodsList" class="space-y-4"></div>

        <!-- Tlačítka akcí -->
        <div class="flex flex-wrap gap-2 pt-2">
          <button onclick="addModalFoodRow()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1">
            <span>+</span> Přidat další jídlo (max 3 doporučeno)
          </button>
          <button onclick="copyYesterdayFoods()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2 rounded-lg text-sm transition">
            📋 Jídla ze včerejška
          </button>
        </div>
      </div>

      <!-- Patka modalu -->
      <div class="p-4 border-t border-slate-800 bg-slate-950 flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm hover:bg-slate-700">Zrušit</button>
        <button onclick="validateAndSaveDay()" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm shadow transition">Uložit den</button>
      </div>
    </div>
  </div>

  <!-- VLASTNÍ MODAL PRO KONTROLU / CHYBY PŘI ULOŽENÍ -->
  <div id="validationModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md shadow-2xl overflow-hidden p-6 space-y-4">
      <div id="validationHeader" class="flex items-center gap-3">
        <span id="validationIcon" class="text-2xl">⚠️</span>
        <h3 id="validationTitle" class="text-base font-bold text-white">Nekompletní zápis</h3>
      </div>
      <div id="validationContent" class="text-sm text-slate-300 space-y-2 bg-slate-950 p-3 rounded-lg border border-slate-800 max-h-48 overflow-y-auto">
        <!-- Seznam chyb nebo shrnutí -->
      </div>
      <div id="validationFooter" class="flex justify-end gap-2 pt-2">
        <!-- Tlačítka se dynamicky vygenerují -->
      </div>
    </div>
  </div>

  <!-- MODAL PRO NASTAVENÍ -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-lg shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
        <h2 class="text-lg font-bold text-white">Nastavení katalogu a obsluhy</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-sm">Zavřít</button>
      </div>
      <div class="p-5 space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Seznam obsluhy (jeden na řádek)</label>
          <textarea id="staffTextarea" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Katalog jídel pro našeptávač (jedno jídlo na řádek)</label>
          <textarea id="catalogTextarea" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 bg-slate-950 flex justify-end gap-3">
        <button onclick="saveSettings()" class="px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm shadow transition">Uložit nastavení</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIKA -->
  <script>
    let state = {
      facilityName: 'Provozovna',
      currentYear: 2026,
      currentMonth: 10, // 0 = Leden, 10 = Listopad
      staff: ['Pavel Z.', 'Martin T.', 'Zachar'],
      catalog: ['Bramboračka', 'Francouzské brambory', 'Hovězí vývar', 'Svíčková omáčka', 'Vařené brambory', 'Kulajda', 'Gulášová', 'Rýže'],
      data: {} // Klíč: "2026-10-15" -> { staff: 'Zachar', foods: [ { name: '...', time1: '11:05', temp1: 72, time2: '12:05', temp2: 73, fix: '' } ] }
    };

    let activeModalDayKey = null;
    let pendingSaveData = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      if (!localStorage.getItem('temperatureApp_state')) {
        const now = new Date();
        state.currentYear = now.getFullYear();
        state.currentMonth = now.getMonth();
      }

      document.getElementById('facilityNameInput').value = state.facilityName;
      document.getElementById('monthSelect').value = state.currentMonth;
      document.getElementById('yearInput').value = state.currentYear;

      renderApp();
    });

    function saveState() {
      localStorage.setItem('temperatureApp_state', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('temperatureApp_state');
      if (saved) {
        try {
          state = { ...state, ...JSON.parse(saved) };
        } catch (e) {
          console.error("Chyba při načítání dat:", e);
        }
      }
    }

    function updateFacilityName(val) {
      state.facilityName = val;
      saveState();
    }

    function changeMonth(delta) {
      state.currentMonth += delta;
      if (state.currentMonth > 11) {
        state.currentMonth = 0;
        state.currentYear++;
      } else if (state.currentMonth < 0) {
        state.currentMonth = 11;
        state.currentYear--;
      }
      document.getElementById('monthSelect').value = state.currentMonth;
      document.getElementById('yearInput').value = state.currentYear;
      saveState();
      renderApp();
    }

    function onMonthSelectChange() {
      state.currentMonth = parseInt(document.getElementById('monthSelect').value);
      saveState();
      renderApp();
    }

    function onYearInputChange() {
      state.currentYear = parseInt(document.getElementById('yearInput').value) || 2026;
      saveState();
      renderApp();
    }

    function setCurrentMonth() {
      const now = new Date();
      state.currentYear = now.getFullYear();
      state.currentMonth = now.getMonth();
      document.getElementById('monthSelect').value = state.currentMonth;
      document.getElementById('yearInput').value = state.currentYear;
      saveState();
      renderApp();
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function getMonthName(monthIndex) {
      const months = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];
      return months[monthIndex];
    }

    function getMonthNameGenitive(monthIndex) {
      const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'zári', 'října', 'listopadu', 'prosince'];
      return months[monthIndex];
    }

    // HLAVNÍ RENDERER APLIKACE (DASHBOARD + TISKOVÁ VERZE)
    function renderApp() {
      renderDashboard();
      renderPrintWeeks();
    }

    // 1. DASHBOARD SEZNAMU DNŮ
    function renderDashboard() {
      const container = document.getElementById('daysDashboardGrid');
      container.innerHTML = '';

      const totalDays = getDaysInMonth(state.currentYear, state.currentMonth);

      const now = new Date();
      const todayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;

      for (let d = 1; d <= totalDays; d++) {
        const dayKey = `${state.currentYear}-${state.currentMonth}-${d}`;
        const dayData = state.data[dayKey];
        const isToday = dayKey === todayKey;
        const isPast = new Date(state.currentYear, state.currentMonth, d) < new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const isFuture = new Date(state.currentYear, state.currentMonth, d) > new Date(now.getFullYear(), now.getMonth(), now.getDate());

        let statusClass = "bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-600";
        let statusBadge = `<span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">Klikni pro úpravu</span>`;
        let statusText = "Klikni pro úpravu";

        if (dayData && dayData.foods && dayData.foods.length > 0) {
          const hasFix = dayData.foods.some(f => f.fix && f.fix.trim() !== '');
          if (hasFix) {
            statusClass = "bg-amber-950/20 border-amber-800/60 text-amber-200 hover:border-amber-700";
            statusBadge = `<span class="text-xs bg-amber-900/50 text-amber-300 border border-amber-700 px-2 py-0.5 rounded font-medium">Zapsáno s nápravou</span>`;
          } else {
            statusClass = "bg-emerald-950/20 border-emerald-800/60 text-emerald-200 hover:border-emerald-700";
            statusBadge = `<span class="text-xs bg-emerald-900/50 text-emerald-300 border border-emerald-700 px-2 py-0.5 rounded font-medium">Zapsáno</span>`;
          }
          statusText = `${dayData.foods.length} pol. | ${dayData.staff || 'Nezadáno'}`;
        } else if (isToday) {
          // Nevyplněný DNEŠNÍ den označen žlutě/amber
          statusClass = "bg-amber-950/40 border-amber-500/80 text-amber-200 hover:border-amber-400 ring-2 ring-amber-500/40";
          statusBadge = `<span class="text-xs bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded">Dnes – nezapsáno</span>`;
          statusText = "Klikni pro úpravu";
        } else if (isPast) {
          statusClass = "bg-rose-950/30 border-rose-800/80 text-rose-200 hover:border-rose-600";
          statusBadge = `<span class="text-xs bg-rose-900/80 text-white px-2 py-0.5 rounded font-bold">Chybí zápis!</span>`;
          statusText = "Zmeškaný den";
        }

        if (isFuture) {
          statusClass = "bg-slate-950/50 border-slate-900 text-slate-600 opacity-60";
          statusBadge = `<span class="text-xs bg-slate-900 text-slate-600 px-2 py-0.5 rounded">Budoucí den</span>`;
          statusText = "Zatím nedostupné";
        }

        const rowDiv = document.createElement('div');
        rowDiv.className = `flex items-center justify-between p-3 rounded-lg border transition cursor-pointer ${statusClass}`;
        rowDiv.onclick = () => openDayModal(dayKey);

        rowDiv.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-8 font-bold text-base text-white text-right">${d}.</div>
            <div class="text-xs text-slate-400 font-medium">${statusText}</div>
          </div>
          <div>${statusBadge}</div>
        `;

        container.appendChild(rowDiv);
      }
    }

    // 2. TISKOVÁ VERZE (2 TÝDNY NA 1 STRÁNKU A4, S DECENTNÍM ODDĚLOVAČEM PO TÝDNU)
    function renderPrintWeeks() {
      const container = document.getElementById('printWeeksContainer');
      container.innerHTML = '';

      const totalDays = getDaysInMonth(state.currentYear, state.currentMonth);
      const monthName = getMonthName(state.currentMonth);

      const periods = [
        { start: 1, end: 15, label: '1. polovina měsíce' },
        { start: 16, end: totalDays, label: '2. polovina měsíce' }
      ];

      periods.forEach((period) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = "print-page bg-white text-black p-2 rounded-xl mb-6";

        let html = `
          <div class="print-header">
            <div class="flex justify-between items-center font-bold">
              <span>Zápis teplot při výdeji jídel – ${state.facilityName}</span>
              <span>Měsíc: ${monthName} ${state.currentYear} (${period.label})</span>
            </div>
          </div>
          <table class="w-full text-left">
            <thead>
              <tr>
                <th class="w-10 text-center">Datum</th>
                <th>Jídlo</th>
                <th class="w-12 text-center">Čas</th>
                <th class="w-10 text-center">°C</th>
                <th class="w-12 text-center">Čas 2</th>
                <th class="w-10 text-center">°C</th>
                <th>Náprava</th>
                <th class="w-24">Jméno</th>
              </tr>
            </thead>
            <tbody>
        `;

        for (let d = period.start; d <= period.end; d++) {
          const dayKey = `${state.currentYear}-${state.currentMonth}-${d}`;
          const dayData = state.data[dayKey] || { staff: '', foods: [] };
          const foods = dayData.foods || [];
          const rowSpan = Math.max(foods.length, 1);

          // Zjištění dne v týdnu pro vložení oddělovače (neděle = 0)
          const dateObj = new Date(state.currentYear, state.currentMonth, d);
          const isEndOfWeek = dateObj.getDay() === 0;

          for (let f = 0; f < rowSpan; f++) {
            const food = foods[f] || null;
            const isFirstFood = f === 0;
            const isLastFoodInDay = f === rowSpan - 1;

            const borderStyle = (isEndOfWeek && isLastFoodInDay) ? 'style="border-bottom: 2.5px solid #1e293b !important;"' : '';

            html += `<tr ${borderStyle}>`;

            if (isFirstFood) {
              html += `
                <td rowspan="${rowSpan}" class="text-center font-bold align-top bg-slate-50">
                  ${d}.${state.currentMonth + 1}.
                </td>
              `;
            }

            if (food) {
              html += `
                <td class="font-medium">${escapeHtml(food.name || '')}</td>
                <td class="text-center">${food.time1 || ''}</td>
                <td class="text-center font-bold">${food.temp1 ? food.temp1 + '°C' : ''}</td>
                <td class="text-center">${food.time2 || ''}</td>
                <td class="text-center font-bold">${food.temp2 ? food.temp2 + '°C' : ''}</td>
                <td>${escapeHtml(food.fix || '')}</td>
              `;
            } else {
              html += `
                <td class="text-slate-400 italic" colspan="5">Bez záznamu</td>
                <td></td>
              `;
            }

            if (isFirstFood) {
              html += `
                <td rowspan="${rowSpan}" class="align-top text-[7.5pt]">
                  ${escapeHtml(dayData.staff || '')}
                </td>
              `;
            }

            html += `</tr>`;
          }
        }

        html += `
            </tbody>
          </table>
        `;

        pageDiv.innerHTML = html;
        container.appendChild(pageDiv);
      });
    }

    // PŘEDULOŽENÍ A KONTROLA VALIDACE
    function validateAndSaveDay() {
      if (!activeModalDayKey) return;

      const staff = document.getElementById('modalStaffSelect').value;
      const rowDivs = document.querySelectorAll('.modal-food-row');
      const foods = [];
      const errors = [];

      if (!staff) {
        errors.push("Chybí jméno odpovědné osoby.");
      }

      rowDivs.forEach((row, idx) => {
        const name = row.querySelector('.food-name-input').value.trim();
        const time1 = row.querySelector('.food-time1-input').value.trim();
        const temp1 = parseInt(row.querySelector('.food-temp1-range').value);
        const time2 = row.querySelector('.food-time2-input').value.trim();
        const temp2 = parseInt(row.querySelector('.food-temp2-range').value);
        const fix = row.querySelector('.food-fix-input').value.trim();

        if (name || time1 || time2) {
          if (!name) errors.push(`Jídlo ${idx + 1}: Chybí název pokrmu.`);
          if (!time1) errors.push(`${name || 'Jídlo ' + (idx + 1)}: Chybí čas 1.`);
          if (!time2) errors.push(`${name || 'Jídlo ' + (idx + 1)}: Chybí čas 2.`);
          if ((temp1 < 63 || temp2 < 63) && !fix) {
            errors.push(`${name || 'Jídlo ' + (idx + 1)}: Teplota klesla pod 63 °C, ale chybí popis nápravy.`);
          }
          foods.push({ name, time1, temp1, time2, temp2, fix });
        }
      });

      if (foods.length === 0) {
        errors.push("Není vyplněno žádné jídlo.");
      }

      pendingSaveData = { dayKey: activeModalDayKey, staff, foods };

      if (errors.length > 0) {
        showValidationModal(false, errors);
      } else {
        showValidationModal(true, pendingSaveData);
      }
    }

    // CUSTOM MODAL PRO CHYBY A POTVRZENÍ
    function showValidationModal(isSuccess, dataOrErrors) {
      const modal = document.getElementById('validationModal');
      const title = document.getElementById('validationTitle');
      const icon = document.getElementById('validationIcon');
      const content = document.getElementById('validationContent');
      const footer = document.getElementById('validationFooter');

      content.innerHTML = '';
      footer.innerHTML = '';

      if (!isSuccess) {
        icon.innerText = "⚠️";
        title.innerText = "Nekompletní nebo chybné údaje";
        title.className = "text-base font-bold text-rose-400";
        
        dataOrErrors.forEach(err => {
          content.innerHTML += `<div class="text-rose-300">• ${escapeHtml(err)}</div>`;
        });

        footer.innerHTML = `
          <button onclick="closeValidationModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm">Opravit v formuláři</button>
        `;
      } else {
        icon.innerText = "✅";
        title.innerText = "Kontrola zápisu OK";
        title.className = "text-base font-bold text-emerald-400";

        content.innerHTML = `<div class="text-slate-200 mb-2">Všechny údaje jsou kompletní a v pořádku. Opravdu je chcete uložit?</div>`;
        dataOrErrors.foods.forEach(f => {
          content.innerHTML += `<div class="text-xs text-slate-400"><b>${escapeHtml(f.name)}</b>: ${f.temp1}°C / ${f.temp2}°C ${f.fix ? '(' + escapeHtml(f.fix) + ')' : ''}</div>`;
        });

        footer.innerHTML = `
          <button onclick="closeValidationModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm">Zpět k úpravám</button>
          <button onclick="executeFinalSave()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm shadow">Uložit a potvrdit</button>
        `;
      }

      modal.classList.remove('hidden');
    }

    function closeValidationModal() {
      document.getElementById('validationModal').classList.add('hidden');
    }

    function executeFinalSave() {
      if (!pendingSaveData) return;

      const { dayKey, staff, foods } = pendingSaveData;
      state.data[dayKey] = { staff, foods };

      foods.forEach(f => {
        if (!state.catalog.some(c => c.toLowerCase() === f.name.toLowerCase())) {
          state.catalog.push(f.name);
        }
      });

      saveState();
      closeValidationModal();
      closeModal();
      renderApp();
      pendingSaveData = null;
    }

    function closeModal() {
      document.getElementById('dayModal').classList.add('hidden');
      activeModalDayKey = null;
    }

    function openSettings() {
      document.getElementById('staffTextarea').value = state.staff.join('\n');
      document.getElementById('catalogTextarea').value = state.catalog.join('\n');
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const staffText = document.getElementById('staffTextarea').value;
      const catalogText = document.getElementById('catalogTextarea').value;

      state.staff = staffText.split('\n').map(s => s.trim()).filter(Boolean);
      state.catalog = catalogText.split('\n').map(s => s.trim()).filter(Boolean);

      saveState();
      closeSettings();
      renderApp();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
